[package]
name = "kara-desktop"
version = "0.1.0"
description = "Kara desktop app: a local-first coding agent"
authors = ["Muhammad Zain Ul Abidin (iamzayn19)"]
license = "Apache-2.0"
repository = "https://github.com/iamzayn19/kara"
edition = "2021"

# Standalone from the main `kara` workspace (different dependency set,
# different release cadence) even though it path-depends on kara-protocol.
[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kara_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros"] }
# Real PTY (not just a piped child process) so an interactive shell inside
# Kara behaves like a real terminal — line editing, job control, color,
# resize all work because the shell actually sees a tty.
portable-pty = "0.8"
# The same JSON-RPC message framing `kara serve --stdio` and the VS Code
# extension already speak; the desktop app is a third client of the same
# protocol, not a reimplementation.
kara-protocol = { path = "../../../crates/kara-protocol" }
tauri-plugin-notification = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"

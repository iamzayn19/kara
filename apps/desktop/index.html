<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kara</title>
    <link rel="icon" href="/src/assets/kara-mark.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div id="brand">
          <img id="brand-mark" src="/src/assets/kara-mark.png" alt="" />
          <span id="brand-name">Kara</span>
        </div>
        <button id="btn-project" class="text-btn" title="Open a different folder">~</button>
        <div id="toolbar-actions">
          <button id="btn-sessions" class="icon-btn" title="Session history">🕘</button>
          <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
          <button id="btn-undo" class="icon-btn" title="Undo Kara's last change">↩</button>
          <button id="btn-new" class="icon-btn" title="New session">＋</button>
        </div>
      </header>

      <main id="transcript" aria-live="polite">
        <div id="empty-state">
          <img id="empty-mark" src="/src/assets/kara-mark.png" alt="" />
          <p>Describe what you want. Kara reads your repo, makes the change, and shows you the diff.</p>
        </div>
      </main>

      <div id="composer-wrap">
        <ul id="cmd-menu" class="hidden"></ul>
        <div id="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Describe what you want, e.g. &quot;fix the failing auth tests&quot;… (/ for commands)"
            autofocus
          ></textarea>
          <div id="composer-row">
            <span id="hint">Enter to send · Shift+Enter for a new line · Esc to stop · / for commands</span>
            <button id="send" title="Send (Enter)">
              <span id="send-label">Send</span>
            </button>
          </div>
        </div>
      </div>

      <footer id="statusbar">
        <button id="model-pill" class="pill" title="Choose a model">no model</button>
        <button id="perm-pill" class="pill" title="Permission mode">—</button>
        <span id="spacer"></span>
        <span id="session-state">starting…</span>
      </footer>
    </div>

    <div id="overlay" class="hidden">
      <div id="panel">
        <div id="panel-header">
          <span id="panel-title"></span>
          <button id="panel-close" class="icon-btn" title="Close">✕</button>
        </div>
        <div id="panel-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

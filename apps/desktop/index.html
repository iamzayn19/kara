<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kara</title>
    <link rel="icon" href="/src/assets/kara-mark.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="btn-sidebar" class="icon-btn" title="Toggle sidebar (⌘B)">▤</button>
        <div id="brand">
          <img id="brand-mark" src="/src/assets/kara-mark.png" alt="" />
          <span id="brand-name">Kara</span>
        </div>
        <span id="project-name" title="">no project open</span>
        <div id="toolbar-actions">
          <button id="btn-theme" class="icon-btn" title="Toggle light/dark theme">◐</button>
          <button id="btn-settings" class="icon-btn" title="Settings (⌘,)">⚙</button>
          <button id="btn-undo" class="icon-btn" title="Undo Kara's last change">↩</button>
          <button id="btn-new" class="icon-btn" title="New session (⌘N)">＋</button>
        </div>
      </header>

      <div id="body">
        <aside id="sidebar">
          <div id="sidebar-tabs" role="tablist">
            <button class="sidebar-tab active" data-panel="project">Project</button>
            <button class="sidebar-tab" data-panel="files">Files</button>
          </div>

          <div id="sidebar-panel-project" class="sidebar-panel">
            <div id="sidebar-top">
              <button id="btn-project" class="sidebar-open-btn" title="Open a different folder (⌘O)">
                <span class="sidebar-open-icon">📁</span>
                <span>Open project…</span>
              </button>
            </div>
            <div class="sidebar-section">
              <div class="sidebar-label">Recent</div>
              <div id="recent-list" class="sidebar-list"></div>
            </div>
            <div class="sidebar-section">
              <div class="sidebar-label">Sessions</div>
              <div id="sessions-list" class="sidebar-list"></div>
            </div>
          </div>

          <div id="sidebar-panel-files" class="sidebar-panel hidden">
            <div id="file-tree" class="sidebar-list"></div>
          </div>
        </aside>

        <div id="main">
          <div id="editor-tabs" role="tablist">
            <button class="editor-tab active" data-tab="chat">Chat</button>
          </div>

          <main id="transcript" aria-live="polite">
            <div id="empty-state">
              <img id="empty-mark" src="/src/assets/kara-mark.png" alt="" />
              <p id="empty-text">Describe what you want. Kara reads your repo, makes the change, and shows you the diff.</p>
              <button id="empty-open-btn" class="approve-btn hidden">Open a project…</button>
            </div>
          </main>

          <div id="editor-container" class="hidden"></div>

          <div id="composer-wrap">
            <ul id="cmd-menu" class="hidden"></ul>
            <div id="composer">
              <div id="composer-top">
                <textarea
                  id="input"
                  rows="1"
                  placeholder="Ask Kara anything, or describe a change… (/ for commands)"
                  autofocus
                ></textarea>
                <button id="btn-voice" class="icon-btn composer-icon-btn" title="Voice input (coming soon)" disabled>🎤</button>
              </div>
              <div id="composer-divider"></div>
              <div id="composer-row">
                <button id="btn-attach" class="icon-btn composer-icon-btn" title="Attach a file (coming soon)" disabled>＋</button>
                <button id="btn-slash" class="icon-btn composer-icon-btn" title="Commands">[/]</button>
                <div id="mode-switch" role="radiogroup" aria-label="Turn mode">
                  <button class="mode-opt active" data-mode="execute" title="Understand, edit, test, review">Execute</button>
                  <button class="mode-opt" data-mode="plan" title="Read-only: propose a plan, wait for approval">Plan</button>
                  <button class="mode-opt" data-mode="review" title="Read-only: risk review of the current diff">Review</button>
                </div>
                <span id="session-timer" title="Time since this session started">0m</span>
                <div style="flex: 1;"></div>
                <button id="perm-pill" class="pill perm-pill" title="Permission mode — click to change">—</button>
                <button id="send" title="Send (Enter)">↑</button>
              </div>
            </div>
            <div id="hint">Enter to send · Shift+Enter for a new line · Esc to stop</div>
          </div>

          <footer id="statusbar">
            <button id="model-pill" class="pill" title="Choose a model">no model</button>
            <button id="context-pill" class="pill" title="Conversation context used — click to compact"></button>
            <span id="spacer"></span>
            <span id="session-state">starting…</span>
          </footer>
        </div>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div id="panel">
        <div id="panel-header">
          <span id="panel-title"></span>
          <button id="panel-close" class="icon-btn" title="Close">✕</button>
        </div>
        <div id="panel-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

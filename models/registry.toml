# Veyra model registry.
#
# Models are data, not code: future releases replace entries here without
# touching the agent. Users can add entries in ~/.veyra/models.toml using the
# same schema.
#
# Fields
#   quality_rank      Provisional ordering used by `/model auto` until Veyra
#                     evaluation results exist. Higher is preferred. Replace
#                     with measured scores from `veyra eval` (eval_score).
#   eval_score        Fraction of the Veyra eval suite solved (0..1), or omitted
#                     when the model has not been evaluated yet.
#   kv_bytes_per_token  Estimated f16 KV-cache bytes per context token, used for
#                     memory planning. Estimates; see docs/MODEL_SUPPORT.md.
#   auto_select       false keeps a model out of automatic selection (e.g.
#                     pending evaluation or too weak for agent work).
#
# Sizes, revisions and SHA-256 values were taken from the Hugging Face API at
# registry creation time (2026-10-05). Downloads are pinned to `revision` and
# verified against `sha256`.


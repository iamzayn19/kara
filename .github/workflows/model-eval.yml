name: Model evaluation

# Real local-model evaluation is slow and needs a large download, so it runs
# only on demand. Standard runners are CPU-only; results there measure CPU
# performance. Prefer running `veyra eval` on representative hardware.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Registry model id
        default: qwen3-1.7b-q4_k_m
      tasks:
        description: Task filter (comma-separated, prefix*)
        default: "python-*"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release --locked -p veyra-cli
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: ./target/release/veyra eval --model "${{ inputs.model }}" --tasks "${{ inputs.tasks }}" --yes --out eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ inputs.model }}
          path: eval.json

name: Windows ARM64 build

# Manual only. Builds the Windows ARM64 binary and uploads it as a workflow
# artifact for testing. It does not create a release or a tag.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (aarch64-pc-windows-msvc)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - run: cargo build --release --locked -p kara-cli --target aarch64-pc-windows-msvc
      - name: Package
        shell: bash
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          scripts/package-release.sh "$version" aarch64-pc-windows-msvc target/aarch64-pc-windows-msvc/release/kara.exe
      - name: Smoke test
        run: ./target/aarch64-pc-windows-msvc/release/kara.exe --version
      - name: Installer test (scripts/install.ps1, from a local release mirror)
        shell: pwsh
        run: |
          $mirror = Join-Path $env:RUNNER_TEMP "mirror"
          New-Item -ItemType Directory -Force -Path $mirror | Out-Null
          $zip = Get-ChildItem dist -Filter "*.zip" | Select-Object -First 1
          Copy-Item $zip.FullName $mirror
          $hash = (Get-FileHash (Join-Path $mirror $zip.Name) -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content (Join-Path $mirror "SHA256SUMS")
          $env:KARA_VERSION = "0.1.0"
          $server = Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", $mirror -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          $env:KARA_RELEASE_BASE = "http://127.0.0.1:8765"
          $env:KARA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "kara-bin"
          $env:KARA_NO_MODIFY_PATH = "1"
          ./scripts/install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $kara = Join-Path $env:KARA_INSTALL_DIR "kara.exe"
          & $kara --version
          & $kara privacy
          & $kara doctor
          # No model is installed on the runner, so a non-zero exit with guidance is expected.
          & $kara run "explain this repository"
          $global:LASTEXITCODE = 0
          Write-Host "install and first-run checks finished"
      - uses: actions/upload-artifact@v4
        with:
          name: kara-windows-arm64
          path: dist/*
          if-no-files-found: error

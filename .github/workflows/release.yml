name: Release

# Builds release binaries and the VSIX for a version tag, then creates a
# draft GitHub Release with SHA256SUMS. Publishing the draft is a manual step
# after the release checklist (docs/RELEASE_CHECKLIST.md) passes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p kara-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          exe=kara; [[ "${{ matrix.target }}" == *windows* ]] && exe=kara.exe
          scripts/package-release.sh "$version" "${{ matrix.target }}" "target/${{ matrix.target }}/release/$exe"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  vsix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: dist-vsix
          path: extensions/vscode/*.vsix

  release:
    needs: [build, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Homebrew formula and winget manifests
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          python3 packaging/render.py --version "$version" --sums dist/SHA256SUMS --out packaging-out
          cp packaging-out/homebrew/kara.rb dist/kara.rb
          (cd packaging-out && zip -qr ../dist/winget-manifests.zip winget)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk '/^## \[/{n++} n==2{print} n>2{exit}' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Kara $GITHUB_REF_NAME" --notes-file notes.md

  publish-extension:
    # Runs only when marketplace tokens are configured as repository secrets.
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-vsix
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath *.vsix
      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"

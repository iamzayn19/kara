name: Desktop installers

# Builds the desktop app's installers (.dmg, .exe/.msi, .deb/.AppImage),
# each bundling its own release build of the kara CLI, and uploads them as
# workflow artifacts. Run it from the Actions tab, or push a version tag.
# Builds are unsigned for now: macOS asks to confirm on first open
# (right-click > Open) and Windows SmartScreen shows "More info > Run anyway".

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple Silicon), os: macos-14, bundles: "app,dmg", out: "dmg/*.dmg" }
          - { name: macOS (Intel), os: macos-13, bundles: "app,dmg", out: "dmg/*.dmg" }
          - { name: Windows (x64), os: windows-latest, bundles: "nsis,msi", out: "nsis/*.exe msi/*.msi" }
          - { name: Linux (x64), os: ubuntu-22.04, bundles: "deb,appimage", out: "deb/*.deb appimage/*.AppImage" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      # beforeBuildCommand builds the CLI and copies it into the bundle.
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Check the bundled CLI runs
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) bin=$(ls -d src-tauri/target/release/bundle/macos/*.app)/Contents/Resources/binaries/kara ;;
            Windows) bin=src-tauri/binaries/kara.exe ;;
            Linux) bin=src-tauri/binaries/kara ;;
          esac
          "$bin" --version
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/installers"
          cd src-tauri/target/release/bundle
          for pattern in ${{ matrix.out }}; do cp $pattern "$RUNNER_TEMP/installers/"; done
          ls -la "$RUNNER_TEMP/installers"
      - uses: actions/upload-artifact@v4
        with:
          name: Kara-${{ matrix.os }}
          path: ${{ runner.temp }}/installers/*
          if-no-files-found: error

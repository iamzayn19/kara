name: Desktop installers

# Builds the desktop app's installers (.dmg, .exe/.msi, .deb/.AppImage),
# each bundling its own release build of the kara CLI, and uploads them as
# workflow artifacts. Run it from the Actions tab, or push a version tag.
# Builds are unsigned for now: macOS asks to confirm on first open
# (right-click > Open) and Windows SmartScreen shows "More info > Run anyway".

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple Silicon), os: macos-14, bundles: "app,dmg", out: "dmg/*.dmg" }
          - { name: macOS (Intel), os: macos-15-intel, bundles: "app,dmg", out: "dmg/*.dmg" }
          - { name: Windows (x64), os: windows-latest, bundles: "nsis,msi", out: "nsis/*.exe msi/*.msi" }
          - { name: Linux (x64), os: ubuntu-22.04, bundles: "deb,appimage", out: "deb/*.deb appimage/*.AppImage" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      # beforeBuildCommand builds the CLI and copies it into the bundle.
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      # Install each installer the way a user would and run Kara from the
      # installed copy, so a package that builds but doesn't install fails.
      - name: Install and run (macOS .dmg)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          mnt="$RUNNER_TEMP/kara-dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" dmg/*.dmg
          # A bundle without a whole-app signature is reported as "damaged"
          # when downloaded on Apple Silicon; ad-hoc signing must cover it.
          codesign --verify --deep --strict --verbose=2 "$mnt/Kara.app"
          "$mnt/Kara.app/Contents/Resources/binaries/kara" --version
          hdiutil detach "$mnt"
      - name: Install and run (Windows .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          $setup = Get-ChildItem nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $kara = Get-ChildItem "$env:LOCALAPPDATA/Kara" -Recurse -Filter kara.exe | Select-Object -First 1
          if (-not $kara) { Get-ChildItem "$env:LOCALAPPDATA/Kara" -Recurse | Select-Object FullName; throw "kara.exe not installed" }
          & $kara.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "kara --version failed" }
      # Remove the .exe install first so the .msi is checked on its own.
      - name: Install and run (Windows .msi)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          $nsisDir = "$env:LOCALAPPDATA/Kara"
          $uninstall = Get-ChildItem $nsisDir -Filter uninstall.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($uninstall) { Start-Process $uninstall.FullName -ArgumentList "/S" -Wait }
          # NSIS's silent uninstaller returns before it finishes deleting;
          # wait, so the .exe's copy can't stand in for the .msi's below.
          for ($i = 0; $i -lt 60 -and (Test-Path "$nsisDir/binaries/kara.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$nsisDir/binaries/kara.exe") { throw "the .exe install didn't uninstall" }
          $msi = Get-ChildItem msi/*.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$($msi.FullName)`"", "/qn", "/l*v", "$env:RUNNER_TEMP/msi.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP/msi.log" -Tail 40; throw "msiexec failed: $($p.ExitCode)" }
          # Where the .msi put Kara, from its own log rather than a guess.
          $dirs = Select-String -Path "$env:RUNNER_TEMP/msi.log" -Pattern "Property\(S\): (INSTALLDIR|APPLICATIONFOLDER|INSTALLFOLDER) = (.+)" |
            ForEach-Object { $_.Matches[0].Groups[2].Value.Trim() }
          "install folder from the .msi log: $($dirs -join '; ')"
          $dirs = @($dirs) + "$env:ProgramFiles/Kara", "${env:ProgramFiles(x86)}/Kara", "$env:LOCALAPPDATA/Programs/Kara"
          $kara = Get-ChildItem $dirs -Recurse -Filter kara.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $kara) {
            "Install folders considered: $($dirs -join '; ')"
            Get-ChildItem $dirs -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            Select-String -Path "$env:RUNNER_TEMP/msi.log" -Pattern "binaries|kara\.exe|Error|Return value 3" | Select-Object -First 30
            throw "kara.exe not installed by the .msi"
          }
          "installed at $($kara.FullName)"
          & $kara.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "kara --version failed" }
      - name: Install and run (Linux .deb)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          sudo apt-get install -y ./deb/*.deb
          bin=$(dpkg -L kara | grep '/binaries/kara$')
          "$bin" --version
      # Runners have no FUSE to mount it; an AppImage can unpack itself.
      - name: Unpack and run (Linux .AppImage)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          app=$(ls appimage/*.AppImage)
          chmod +x "$app"
          cd "$RUNNER_TEMP" && "$OLDPWD/$app" --appimage-extract > /dev/null
          bin=$(find "$RUNNER_TEMP/squashfs-root" -path '*/binaries/kara' -type f | head -1)
          test -n "$bin" || { echo "no bundled kara in the AppImage"; exit 1; }
          "$bin" --version
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/installers"
          cd src-tauri/target/release/bundle
          for pattern in ${{ matrix.out }}; do cp $pattern "$RUNNER_TEMP/installers/"; done
          ls -la "$RUNNER_TEMP/installers"
      - uses: actions/upload-artifact@v4
        with:
          name: Kara-${{ matrix.os }}
          path: ${{ runner.temp }}/installers/*
          if-no-files-found: error

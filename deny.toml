# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/).
# Run with `cargo deny check` or scripts/license-audit.sh.

[graph]
all-features = false

[licenses]
# Permissive licenses compatible with distributing Kara under Apache-2.0.
# MPL-2.0 is file-level copyleft: allowed for unmodified dependencies.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
